name: build and push relay to ECR

# ARCADIA FORK ONLY (spec node N1). Upstream's docker.yml publishes the public
# multi-arch image to GHCR and is untouched; this workflow builds the SAME
# Dockerfile into the two Arcadia AI-account ECRs, because the dev-ai and prd-ai
# EKS clusters have no internet egress and cannot pull ghcr.io
# (cloud-config-infrastructures/README.md, "Step 1: mirror the image").
#
# This repository is public. Account ids and role ARNs are NOT written here or
# anywhere else in it: they are repository secrets, which GitHub masks in the
# public run logs. Region and repository name come from the chart's
# values.yaml (`region`, relayImage.repositoryPath).
#
# Differences from docker.yml, all deliberate:
#   * linux/amd64 only. The clusters run amd64 nodes; the arm64 half of the
#     upstream matrix would double CI wall-clock for an image nothing pulls.
#   * Tag is `main-<first 10 hex of the commit sha>` — the tag shape the ArgoCD
#     Application carries and the deploy-dev job below rewrites. No :latest, no
#     :main floating tag: a floating tag plus `imagePullPolicy: IfNotPresent`
#     silently pins whatever each node cached first.
#   * Registry build cache in ECR (`buzz/relay-buildcache`), not GHCR. A cold
#     Rust build of this workspace is 30-60 min; the cache is what keeps the
#     60-minute timeout below honest.
#   * PRs only validate planning and offline chart renders, with no AWS token.
#     Publication requires explicit dispatch or BUZZ_ECR_PUBLISH_ENABLED=true.
#   * NO prd deploy job, by decision D10 + SRE-ARIA-CHANGE-CONTROL: the image is
#     pushed to both accounts so a prd promotion needs no rebuild, but prd
#     promotion itself is a manual CCI PR with an approved ACM CR, deployer
#     != implementer.
#
# Repo configuration this workflow expects (provisioned by N-1, SRE):
#   secrets.AWS_ACCOUNT_ID_DEV_AI / AWS_ACCOUNT_ID_PRD_AI
#     Each cluster's `account`, from its private environment record:
#     cloud-config-infrastructures <cluster dir>/global-helm-values-patch.yaml.
#   secrets.ECR_ROLE_ARN_DEV_AI / ECR_ROLE_ARN_PRD_AI
#     GitHub-OIDC role in each account. Secrets, not variables: variable values
#     are printed unmasked in the public run logs.
#     The plan job refuses a role ARN outside its environment's account.
#     Each needs: ecr:GetAuthorizationToken, and on buzz/relay +
#     buzz/relay-buildcache only — BatchCheckLayerAvailability, PutImage,
#     InitiateLayerUpload, UploadLayerPart, CompleteLayerUpload,
#     BatchGetImage, GetDownloadUrlForLayer, DescribeRepositories.
#     It deliberately does NOT need ecr:CreateRepository — the preflight step
#     fails with instructions instead of self-provisioning registries.
#   secrets.REPO_MANAGER_GH_APP_ID / REPO_MANAGER_GH_APP_PRIVATE_KEY
#     Org-level Actions secrets for the `aa-repository-manager-app` GitHub App
#     (installed org-wide, contents:write) — the credential the deploy-dev job
#     uses to write cloud-config-infrastructures. Same pattern as
#     aria-bot/.github/workflows/bump-vendored-brain.yml.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - ".github/workflows/build-and-push-ecr.yml"
      - "deploy/charts/buzz-arcadia/**"
      - "deploy/scripts/**"
  pull_request:
    paths:
      - ".github/workflows/build-and-push-ecr.yml"
      - "deploy/charts/buzz/**"
      - "deploy/charts/buzz-arcadia/**"
      - "deploy/scripts/**"
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only preflight or build and publish to both ECR accounts
        type: choice
        options: [preflight, publish]
        default: preflight
      deploy_dev:
        description: Also update an existing reviewed dev-ai GitOps Application
        type: boolean
        default: false

# Never cancel a publish mid-flight; serialize per ref instead.
concurrency:
  group: build-and-push-ecr-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    name: Validate Arcadia deployment contracts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.14.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - run: python deploy/scripts/test-ecr-release-plan.py
      - run: python deploy/scripts/test-arcadia-chart.py
      - run: python deploy/scripts/test-provision-secrets.py

  plan:
    name: Check publication configuration and intent
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      publish: ${{ steps.plan.outputs.publish }}
      deploy_dev: ${{ steps.plan.outputs.deploy_dev }}
      region: ${{ steps.plan.outputs.region }}
      repository: ${{ steps.plan.outputs.repository }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - id: plan
        env:
          BUZZ_ECR_PUBLISH_ENABLED: ${{ vars.BUZZ_ECR_PUBLISH_ENABLED }}
          BUZZ_DEV_GITOPS_ENABLED: ${{ vars.BUZZ_DEV_GITOPS_ENABLED }}
          AWS_ACCOUNT_ID_DEV_AI: ${{ secrets.AWS_ACCOUNT_ID_DEV_AI }}
          AWS_ACCOUNT_ID_PRD_AI: ${{ secrets.AWS_ACCOUNT_ID_PRD_AI }}
          ECR_ROLE_ARN_DEV_AI: ${{ secrets.ECR_ROLE_ARN_DEV_AI }}
          ECR_ROLE_ARN_PRD_AI: ${{ secrets.ECR_ROLE_ARN_PRD_AI }}
          RELEASE_MODE: ${{ inputs.mode }}
          DEPLOY_DEV: ${{ inputs.deploy_dev }}
          GITOPS_CREDENTIALS_CONFIGURED: ${{ secrets.REPO_MANAGER_GH_APP_ID != '' && secrets.REPO_MANAGER_GH_APP_PRIVATE_KEY != '' }}
        run: python deploy/scripts/ecr-release-plan.py

  build-push:
    name: ECR preflight and requested publication
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # OIDC assume into both AI accounts
    outputs:
      image-tag: ${{ steps.tag.outputs.image_tag }}
    env:
      AWS_REGION: ${{ needs.plan.outputs.region }}
      # Read here rather than passed from the plan job: GitHub drops job
      # outputs that contain a secret.
      DEV_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID_DEV_AI }}
      PRD_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID_PRD_AI }}
      ECR_REPOSITORY: ${{ needs.plan.outputs.repository }}
      ECR_CACHE_REPOSITORY: ${{ needs.plan.outputs.repository }}-buildcache

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Compose image tag
        if: needs.plan.outputs.publish == 'true'
        id: tag
        run: |
          set -euo pipefail
          # First 10 hex chars of the commit sha. `main-<short10-sha>` is the
          # exact shape preprd/dev-ai/buzz/application.yaml carries and the
          # deploy-dev job's sed guard matches (`main-[0-9a-f]{10}`).
          echo "image_tag=main-${GITHUB_SHA:0:10}" >> "$GITHUB_OUTPUT"
          echo "Building ${ECR_REPOSITORY}:main-${GITHUB_SHA:0:10}"

      # ── dev-ai account ───────────────────────────────────────────────────
      - name: Configure AWS credentials (dev-ai)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          allowed-account-ids: ${{ env.DEV_ACCOUNT }}
          role-to-assume: ${{ secrets.ECR_ROLE_ARN_DEV_AI }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to dev-ai ECR
        if: needs.plan.outputs.publish == 'true'
        id: ecr-dev
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Preflight — dev-ai repositories exist
        run: |
          set -euo pipefail
          # Read-only check. The OIDC role has no ecr:CreateRepository on
          # purpose (ECR provisioning is SRE's, node N-1), so a missing repo
          # must fail here with the fix rather than 15 minutes later as an
          # opaque "name unknown" from the layer push, or — worse for the
          # cache repo — as a cache-export error that fails a green build.
          if ! aws ecr describe-repositories --region "$AWS_REGION" \
              --repository-names "$ECR_REPOSITORY" "$ECR_CACHE_REPOSITORY" >/dev/null; then
            echo "::error title=ECR repositories missing in dev-ai::The dev-ai account must have BOTH '${ECR_REPOSITORY}' and '${ECR_CACHE_REPOSITORY}' (node N-1). The buildcache repo is not optional: buildx fails the build when cache export cannot write. Ask SRE to run: aws ecr create-repository --repository-name ${ECR_CACHE_REPOSITORY} --region ${AWS_REGION}"
            exit 1
          fi

      # ── prd-ai account ───────────────────────────────────────────────────
      # Second OIDC assume. `unset-current-credentials: true` is REQUIRED:
      # configure-aws-credentials v4 finds the dev-ai keys this job already
      # exported and role-chains from them, which fails (dev-ai's role has no
      # trust relationship with prd-ai's). Clearing them forces a fresh OIDC
      # token exchange, which is what the two independent roles are for.
      # The dev-ai docker login stays in ~/.docker/config.json — logins
      # accumulate per registry host, so one build can push to both.
      - name: Configure AWS credentials (prd-ai)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          allowed-account-ids: ${{ env.PRD_ACCOUNT }}
          role-to-assume: ${{ secrets.ECR_ROLE_ARN_PRD_AI }}
          aws-region: ${{ env.AWS_REGION }}
          unset-current-credentials: true

      - name: Login to prd-ai ECR
        if: needs.plan.outputs.publish == 'true'
        id: ecr-prd
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Preflight — prd-ai repository exists
        run: |
          set -euo pipefail
          # Only the image repo here; the build cache lives in dev-ai alone
          # (see the cache-to note on the build step).
          if ! aws ecr describe-repositories --region "$AWS_REGION" \
              --repository-names "$ECR_REPOSITORY" >/dev/null; then
            echo "::error title=ECR repository missing in prd-ai::The prd-ai account must have '${ECR_REPOSITORY}' (node N-1). It is populated on every main build so a prd promotion is a tag change, never a rebuild."
            exit 1
          fi

      - name: Report read-only preflight
        if: needs.plan.outputs.publish != 'true'
        run: echo "Both account repository preflights passed. No image was published or deployed." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        if: needs.plan.outputs.publish == 'true'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          # Default parallelism of 4 OOMs the 7 GB GitHub runner during the
          # Rust compile — same cap and same reason as docker.yml.
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2

      - name: Build and push to both account ECRs
        if: needs.plan.outputs.publish == 'true'
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false # ECR manifest lists confuse older EKS pull paths
          tags: |
            ${{ steps.ecr-dev.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.image_tag }}
            ${{ steps.ecr-prd.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.image_tag }}
          labels: |
            org.opencontainers.image.title=Buzz relay (Arcadia)
            org.opencontainers.image.description=WebSocket relay server for the Buzz communications platform
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ github.sha }}
          # `image-manifest=true,oci-mediatypes=true` is mandatory for ECR:
          # ECR rejects buildkit's default cache config media type, and without
          # these the cache export fails and takes the whole build red.
          # One cache, in dev-ai: the build runs once, and a second export to
          # prd-ai would pay the upload twice to warm a cache nothing reads.
          cache-from: |
            type=registry,ref=${{ steps.ecr-dev.outputs.registry }}/${{ env.ECR_CACHE_REPOSITORY }}:amd64
          cache-to: |
            type=registry,ref=${{ steps.ecr-dev.outputs.registry }}/${{ env.ECR_CACHE_REPOSITORY }}:amd64,mode=max,compression=zstd,image-manifest=true,oci-mediatypes=true

      # Registries embed the account ids, so the public summary names the
      # environments and the digest instead.
      - name: Summary
        if: needs.plan.outputs.publish == 'true'
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "### Pushed \`${ECR_REPOSITORY}:${IMAGE_TAG}\` to the dev-ai and prd-ai registries"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "Verify:"
            echo '```'
            echo "aws ecr describe-images --repository-name ${ECR_REPOSITORY} --image-ids imageTag=${IMAGE_TAG} --region ${AWS_REGION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    name: Bump dev-ai image tag in cloud-config-infrastructures
    needs: [plan, build-push]
    if: needs.plan.outputs.deploy_dev == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # nothing here uses the default GITHUB_TOKEN
    env:
      CCI_REPOSITORY: cloud-config-infrastructures
      CCI_BRANCH: ai-dev
      APP_FILE: preprd/dev-ai/buzz/application.yaml

    # SHARED with aria-frontend's bridge tag-bump job (spec node N5): both jobs
    # write cloud-config-infrastructures branch `ai-dev`, and this group name is
    # the contract that says so.
    #
    # Read this before trusting it: GitHub concurrency groups are scoped to a
    # REPOSITORY. Two jobs in two different repos cannot actually share one, no
    # matter how the group is spelled. The name is kept identical because it is
    # the documented pairing, and it does serialize this repo's own runs — but
    # the mechanism that makes a simultaneous relay bump and bridge bump safe is
    # the fetch/rebase/retry push loop below, not this block. Do not delete the
    # loop on the strength of this group.
    concurrency:
      group: cci-ai-dev-image-tag-bump
      cancel-in-progress: false

    steps:
      - name: Reject superseded deployment before obtaining write credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "::error::This source commit is no longer main; its image remains available but no GitOps update will occur."
            exit 1
          fi

      # Installation token for aa-repository-manager-app, down-scoped to the one
      # repo it writes. The default GITHUB_TOKEN cannot reach another repo at
      # all, and a PAT would be org-wide and un-revocable at job end.
      - name: Mint installation token for cloud-config-infrastructures
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.REPO_MANAGER_GH_APP_ID }}
          private-key: ${{ secrets.REPO_MANAGER_GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.CCI_REPOSITORY }}
          permission-contents: write

      - name: Checkout the dev-ai GitOps branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.repository_owner }}/${{ env.CCI_REPOSITORY }}
          ref: ${{ env.CCI_BRANCH }}
          token: ${{ steps.app_token.outputs.token }}
          path: cci
          fetch-depth: 0

      - name: Rewrite the relay image tag
        id: bump
        working-directory: cci
        env:
          IMAGE_TAG: ${{ needs.build-push.outputs.image-tag }}
        run: |
          set -euo pipefail

          # ── grep guards ───────────────────────────────────────────────────
          # Explicit GitOps opt-in requires an existing reviewed Application.
          if [ ! -f "$APP_FILE" ]; then
            echo "::error::Requested dev deployment has no reviewed Application at ${APP_FILE}. Image publication succeeded; deployment did not occur."
            exit 1
          fi

          # Match ONLY the relay tag line. `main-[0-9a-f]{10}` also matches the
          # placeholder N7 ships (main-0000000000) and cannot match the redis
          # image tag (v8.6.0) or any other `tag:` key in the file. Exactly one
          # match is required — zero means the file was restructured and the
          # regex is now lying; more than one means an ambiguous edit. Both are
          # a hard stop, never a "best effort" sed.
          TAG_RE='^[[:space:]]*tag: "main-[0-9a-f]\{10\}"[[:space:]]*$'
          MATCHES="$(grep -c "$TAG_RE" "$APP_FILE" || true)"
          if [ "$MATCHES" != "1" ]; then
            echo "::error title=refusing to bump::Expected exactly 1 line matching 'tag: \"main-<10 hex>\"' in ${APP_FILE}, found ${MATCHES}. Someone changed the Application's shape; fix the file or this guard, do not loosen the regex to make a sed land."
            exit 1
          fi

          CURRENT="$(grep -o 'main-[0-9a-f]\{10\}' "$APP_FILE" | head -n1)"
          if [ "$CURRENT" = "$IMAGE_TAG" ]; then
            echo "Already at ${IMAGE_TAG} — nothing to do."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sed -i "s/main-[0-9a-f]\{10\}/${IMAGE_TAG}/" "$APP_FILE"

          # Post-condition: exactly one line changed, and it now carries the new
          # tag. A sed that silently matched nothing must not commit clean.
          CHANGED="$(git diff --numstat -- "$APP_FILE" | awk '{print $1"/"$2}')"
          if [ "$CHANGED" != "1/1" ]; then
            echo "::error title=unexpected diff::sed produced '${CHANGED}' added/removed lines in ${APP_FILE}; expected 1/1. Nothing committed."
            git checkout -- "$APP_FILE"
            exit 1
          fi
          grep -q "tag: \"${IMAGE_TAG}\"" "$APP_FILE" || {
            echo "::error title=tag not written::${APP_FILE} does not contain tag: \"${IMAGE_TAG}\" after sed."
            exit 1
          }

          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "previous=${CURRENT}" >> "$GITHUB_OUTPUT"
          git --no-pager diff -- "$APP_FILE"

      - name: Commit and push the dev-ai GitOps branch
        if: steps.bump.outputs.bumped == 'true'
        working-directory: cci
        env:
          IMAGE_TAG: ${{ needs.build-push.outputs.image-tag }}
          PREVIOUS: ${{ steps.bump.outputs.previous }}
        run: |
          set -euo pipefail
          git config user.name "aa-repository-manager-app[bot]"
          git config user.email "aa-repository-manager-app[bot]@users.noreply.github.com"
          git add "$APP_FILE"
          # Two -m flags, not one multi-line string: a heredoc-style -m inside a
          # YAML block scalar carries the block's indentation into the commit body.
          git commit \
            -m "buzz relay dev-ai image ${PREVIOUS} -> ${IMAGE_TAG}" \
            -m "Automated bump from ${GITHUB_REPOSITORY}@${GITHUB_SHA}. dev-ai only — prd promotion is a manual PR with an approved ACM CR."

          # Cross-repo write safety. aria-frontend's bridge bump job writes this
          # same branch, in a different repository, so no concurrency group can
          # order the two. Rebase and retry on rejection: the two jobs touch
          # different files, so a rebase is always a clean fast-forward of one
          # onto the other. Bounded — five failures in a row is not contention,
          # it is something structural, and it should go red.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${CCI_BRANCH}"; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}) — someone else wrote ${CCI_BRANCH}; rebasing."
            git fetch origin "$CCI_BRANCH"
            git rebase "origin/${CCI_BRANCH}"
            sleep $(( attempt * 3 ))
          done
          echo "::error title=could not push tag bump::Five rebase+push attempts against ${CCI_REPOSITORY} ${CCI_BRANCH} all failed. The image ${IMAGE_TAG} IS in ECR — recover by editing ${APP_FILE} by hand."
          exit 1
