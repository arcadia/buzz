  "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib",
  "OpenSSL", "CC0-1.0", "CDLA-Permissive-2.0", "MITNFA", "MPL-2.0",
  "BSL-1.0", "Unlicense", "BlueOak-1.0.0", "bzip2-1.0.6",
]
ignore-dev-dependencies = true
workarounds = ["ring"]
