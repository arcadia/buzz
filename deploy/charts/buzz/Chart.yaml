apiVersion: v2
name: buzz
description: |
  Buzz — a Nostr-based messaging platform for human–agent collaboration.

  A single relay binary serving WebSocket + REST + web UI, backed by
  PostgreSQL and Redis. Configurable for single-node evaluation
  (subcharts on) and HA production (external services, existingSecret).
type: application
version: 0.1.6
appVersion: "0.1.0"
home: https://github.com/block/buzz
sources:
  - https://github.com/block/buzz
keywords:
  - nostr
  - relay
  - messaging
  - websocket
  - chat
maintainers:
  - name: Block
    url: https://github.com/block
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: Optional READ_DATABASE_URL env (secretKeyRef) enabling relay read-replica routing; absent key preserves prior behavior.
  artifacthub.io/license: Apache-2.0

# Optional eval-only subcharts. Production deploys disable both and point
# externalPostgresql / externalRedis (or secrets.existingSecret) at managed
# services.
#
# ARCADIA FORK: the `postgres` and `redis` dependencies
# (oci://registry-1.docker.io/cloudpirates) are removed here — the deployment
# clusters have no internet egress, so `helm dependency build` can never resolve
# them, and both bundled services are eval-only. postgresql.enabled and
# redis.enabled must stay false (guarded in the buzz-arcadia wrapper); Postgres
# is a Crossplane RDS claim and Redis is an in-cluster Deployment, both in
# deploy/charts/buzz-arcadia. Restore this block when merging upstream, then
# delete it again.
