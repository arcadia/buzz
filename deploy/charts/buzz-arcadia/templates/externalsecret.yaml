{{- include "buzz-arcadia.validate" . -}}
{{- if .Values.externalSecret.enabled }}
{{- $ssm := include "buzz-arcadia.ssmPrefix" . -}}
{{- $connSecret := include "buzz-arcadia.rdsConnectionSecretName" . -}}
# Relay-tier secrets. One ExternalSecret produces the single Secret the relay
# mounts (charts/buzz/templates/deployment.yaml:162-202 reads every secret env
# from `secrets.existingSecret`), pulling from two stores:
#
#   * ClusterSecretStore/ssm-clustersecretstore — the out-of-band SSM params
#     provisioned by the pre-flight runbook (N6).
#   * SecretStore/<database.secretStore.name> (Kubernetes provider, rendered in
#     database-url.yaml) — the Crossplane RDS connection Secret, whose endpoint
#     does not exist until the same sync provisions the instance (decision O3).
#
# DATABASE_URL and REDIS_URL are composed in the target template below, so the
# raw connection components never land in the Secret. mergePolicy is left at the
# default (Replace): the rendered Secret contains exactly the keys listed here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.targetName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "buzz-arcadia.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStore.name }}
    kind: {{ .Values.externalSecret.secretStore.kind }}
  target:
    name: {{ .Values.externalSecret.targetName }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        {{- range $key, $path := .Values.externalSecret.data }}
        {{ $key }}: "{{ printf "{{ .%s }}" $key }}"
        {{- end }}
        # postgres://<user>:<pass>@<endpoint>/<db> — no port is appended: the
        # Crossplane endpoint value carries one when the composition emits
        # host:port, and Postgres defaults to 5432 (the claim's port) when it
        # does not.
        DATABASE_URL: "postgres://{{ `{{ .db_username }}` }}:{{ `{{ .db_password | urlquery }}` }}@{{ `{{ .db_endpoint }}` }}/{{ .Values.rds.dbName }}{{ if .Values.database.sslMode }}?sslmode={{ .Values.database.sslMode }}{{ end }}"
        {{- if .Values.redis.enabled }}
        REDIS_URL: "redis://:{{ `{{ .REDIS_PASSWORD | urlquery }}` }}@{{ include "buzz-arcadia.redisHost" . }}:{{ .Values.redis.port }}"
        {{- end }}
  data:
    {{- range $key, $path := .Values.externalSecret.data }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $ssm }}/{{ $path }}
    {{- end }}
    # Crossplane connection Secret components — template inputs only; the
    # default (Replace) merge policy keeps them out of the rendered Secret.
    - secretKey: db_username
      sourceRef:
        storeRef:
          name: {{ .Values.database.secretStore.name }}
          kind: SecretStore
      remoteRef:
        key: {{ $connSecret }}
        property: {{ .Values.database.connectionSecret.usernameKey }}
    - secretKey: db_password
      sourceRef:
        storeRef:
          name: {{ .Values.database.secretStore.name }}
          kind: SecretStore
      remoteRef:
        key: {{ $connSecret }}
        property: {{ .Values.database.connectionSecret.passwordKey }}
    - secretKey: db_endpoint
      sourceRef:
        storeRef:
          name: {{ .Values.database.secretStore.name }}
          kind: SecretStore
      remoteRef:
        key: {{ $connSecret }}
        property: {{ .Values.database.connectionSecret.endpointKey }}
{{- end }}
