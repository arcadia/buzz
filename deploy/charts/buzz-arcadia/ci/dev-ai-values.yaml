# dev-ai rendering fixture (account 258174056699, cluster dev-ai).
#
# This is the reference for the ArgoCD Application's inline `helm.values` in
# cloud-config-infrastructures branch `ai-dev`
# (preprd/dev-ai/buzz/application.yaml, sync-wave 70), with one difference: the
# nine `account`/`region`/... globals below are NOT written in the Application —
